@if (type === '') {
  <img class="app-logo--black" src="assets/img/logo/logo-big-black.png" [style.width]="logoWidth"/>
  <img class="app-logo--white" src="assets/img/logo/logo-big-white.png" [style.width]="logoWidth"/>
}

@if (type === 'black') {
  <img class="app-logo--force-black" src="assets/img/logo/logo-big-black.png" [style.width]="logoWidth"/>
}

@if (type === 'white') {
  <img class="app-logo--force-white" src="assets/img/logo/logo-big-white.png" [style.width]="logoWidth"/>
}
